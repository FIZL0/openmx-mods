# agent-runner (github.com/FIZL0/agent-runner): `agent-runner run 3` inside tmux works plan/TODO.md.

[plan]
journal = "journal"

[run]
test = "./check.sh"
rules = "AGENTS.md"
slots = 3
weekly_max = 97  # % of 7-day usage past which no new task starts (default 90)
notes = ".runner"
# The discs, what was taken off them, and the openmx checkout the tools build against: all git-ignored.
links = ["iso", "extracted", "out", "openmx"]
# Reopens tasks blocked on openmx (`openmx: MD2, MD10` in the reason) once openmx has landed them. Exits 0 always.
before_start = "./openmx-gate"

[git]
push = "origin"
push_merge = true
