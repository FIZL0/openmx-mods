[package]
name = "bpb"
description = "Decodes BPB, MX vs. ATV Untamed's binary INI (.scn.bpb, .toy.bpb, ...), to INI text"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dev-dependencies]
# The scene reader the decoded text has to satisfy: openmx's (AGENTS.md).
game-sim = { path = "../../openmx/crates/game-sim" }
# The disc test (`--ignored`) finds the image and reads the PSR with discx, and the map archives
# (which `Res::parse` refuses) through survey's view.
discx = { path = "../discx" }
survey = { path = "../survey" }
