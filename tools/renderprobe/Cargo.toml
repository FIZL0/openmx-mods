[package]
name = "renderprobe"
description = "A map's render-side files (textures, materials, models, sky, ecosystem, toys, terrain pages) through openmx game-render's readers"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# The readers under test: openmx's own (AGENTS.md). No GPU: only the file readers are wanted.
game-render = { path = "../../openmx/crates/game-render", default-features = false }
game-sim = { path = "../../openmx/crates/game-sim" }
# The disc by its boot ELF, and the terrain header and page walk the survey already does.
discx = { path = "../discx" }
survey = { path = "../survey" }
